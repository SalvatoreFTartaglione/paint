name: Build and test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    # Windows runner: the JavaFX shape classes need a graphics toolkit even in unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and run the tests
        run: mvn -B verify
